name: Build and deploy site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# one run per branch; a newer push on a PR replaces the running build,
# a deploy from main always runs to the end
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # .tool-versions is the single source for the Hugo and Dart Sass versions
      - name: Read tool versions
        run: |
          echo "HUGO_VERSION=$(awk '$1 ~ /hugo/ {print $2}' .tool-versions)" >> "$GITHUB_ENV"
          echo "SASS_VERSION=$(awk '$1 ~ /dart-sass/ {print $2}' .tool-versions)" >> "$GITHUB_ENV"

      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools
          key: tools-hugo-${{ env.HUGO_VERSION }}-sass-${{ env.SASS_VERSION }}

      - name: Download Hugo and Dart Sass
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tools/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tools/hugo" hugo
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tools"

      - name: Add tools to PATH
        run: |
          echo "$RUNNER_TEMP/tools/hugo" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/dart-sass" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          hugo version
          sass --version

      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('content/**/*.jpg', 'content/**/*.png', 'config.yaml') }}
          restore-keys: |
            hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo

      # Deploy to the webhost (web-volki-01) with rsync over ssh.
      # Setup:
      #   - create an ssh key pair for user procedere on the webhost
      #   - private key -> GitHub secret DEPLOY_KEY
      #   - public key -> ~/.ssh/authorized_keys on the webhost:
      #       command="rrsync /home/procedere/public_html",restrict PUBLIC_KEY_STRING_HERE
      #   - DEPLOY_HOST is login.oetiker.ch
      #   - DEPLOY_PORT is the port forwarded to ssh on the webhost
      #   - DEPLOY_KNOWN_HOSTS is the host key line, as printed by
      #       ssh-keyscan -p <DEPLOY_PORT> login.oetiker.ch
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOSTKEY_CHECK=yes
          else
            echo "::warning::secret DEPLOY_KNOWN_HOSTS is not set; the host key of the webhost is not checked"
            HOSTKEY_CHECK=accept-new
          fi
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_KEY"
          rsync -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=$HOSTKEY_CHECK" \
            --archive --delete --exclude '*.jpg' public/* "procedere@$DEPLOY_HOST:"
